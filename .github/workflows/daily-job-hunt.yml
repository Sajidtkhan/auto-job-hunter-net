name: Daily 9 AM Automated Job Hunter (.NET & SQL)

on:
  schedule:
    # 3:30 UTC = 9:00 AM IST (Indian Standard Time) every morning
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

permissions:
  contents: write

jobs:
  hunt-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Automated Job Scan & Apply
        run: |
          echo "Executing automated job search & apply for Dubai, Germany & Saudi Arabia..."
          dotnet run -- --scan-and-apply

      - name: Commit & Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db profile.json config.json || true
          git commit -m "Auto-update daily job hunt results [skip ci]" || echo "No changes"
          git push || echo "Push failed or nothing to push"
